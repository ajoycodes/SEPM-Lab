services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"   # only this computer can reach it
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db                            # "db" is the service name below
      DB_NAME: university
      DB_USER: university
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy           # wait until PostgreSQL accepts connections

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: university
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - university_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  university_data:
