spring.application.name=university-management-system
# Runs on H2 unless Docker Compose turns on the postgres profile.
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
# The first admin, created only when the database is empty.
app.bootstrap.email=${ADMIN_EMAIL:admin@university.edu}
app.bootstrap.password=${ADMIN_PASSWORD:}
