spring:
  application:
    name: university-management-system

  # Local run (IntelliJ / ./mvnw spring-boot:run) uses the database from `docker compose up db`.
  # Inside Docker Compose these are overridden by SPRING_DATASOURCE_* in compose.yaml.
  datasource:
    url: jdbc:postgresql://localhost:5432/ums
    username: ums
    password: ums_password

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

# Passwords for the three starting accounts, created only when the database is empty.
# Override with APP_SEED_ADMIN_PASSWORD, APP_SEED_TEACHER_PASSWORD, APP_SEED_STUDENT_PASSWORD.
app:
  seed:
    admin-password: admin123
    teacher-password: teacher123
    student-password: student123
