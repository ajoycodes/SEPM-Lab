# Runs the University Management System tests on GitHub every time code is pushed or a pull request is opened.
name: University Management System tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UniversityManagementSystem

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit tests
        run: ./mvnw -B test -Dtest='*UnitTest'

      - name: Integration tests
        run: ./mvnw -B test -Dtest='*IntegrationTest'
